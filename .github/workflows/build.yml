- name: Build ARM release
        run: |
          set -eu
          docker run --rm -v "$PWD/$SRC_DIR":/src -w /src debian:bullseye sh -c '
            set -eu
            printf "%s\n" \
              "deb http://archive.debian.org/debian bullseye main" \
              "deb http://archive.debian.org/debian-security bullseye-security main" \
              > /etc/apt/sources.list

            apt-get -o Acquire::Check-Valid-Until=false update -qq
            apt-get install -y -qq gcc gcc-arm-linux-gnueabihf libc6-dev-armhf-cross binutils-arm-linux-gnueabihf make python3 zip qemu-user

            make clean
            make test
            make arm-test
            make release
          '
