name: Build release

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate source
        run: |
          if [ ! -f Makefile ]; then
            zip=$(ls *source*.zip | head -n 1)
            unzip -q "$zip" -d src_unzipped
            d=$(dirname "$(find src_unzipped -name Makefile | head -n 1)")
            echo "SRC_DIR=$d" >> "$GITHUB_ENV"
          else
            echo "SRC_DIR=." >> "$GITHUB_ENV"
          fi

      - name: Build ARM release
        run: |
          docker run --rm -v "$PWD/$SRC_DIR":/src -w /src debian:bullseye sh -c '
            set -e
            if ! apt-get update -qq; then
              echo "Normal apt update failed; switching to archive.debian.org"
              sed -i "s|security.debian.org/debian-security|archive.debian.org/debian-security|; s|deb.debian.org/debian|archive.debian.org/debian|; /bullseye-updates/d" /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update -qq
            fi
            apt-get install -y -qq gcc gcc-arm-linux-gnueabihf libc6-dev-armhf-cross binutils-arm-linux-gnueabihf make python3 zip qemu-user >/dev/null
            make clean && make test && make arm-test && make release
          '

      - uses: actions/upload-artifact@v4
        with:
          name: VelvetChords-release
          path: ${{ env.SRC_DIR }}/dist/*.zip
